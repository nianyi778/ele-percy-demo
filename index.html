<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Demo Shop</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1c2230; }
  header { background: #fff; border-bottom: 1px solid #e3e6eb; padding: 16px 32px; font-weight: 600; }
  main { padding: 32px; display: grid; grid-template-columns: repeat(3, 220px); gap: 16px; }
  .card { background: #fff; border: 1px solid #e3e6eb; border-radius: 10px; padding: 16px; }
  .price { font-size: 20px; font-weight: 700; margin: 8px 0 12px; }
  .buy { background: #2563eb; color: #fff; border: 0; border-radius: 6px; padding: 8px 14px; font-size: 14px; }
</style>
</head>
<body>
<header>Demo Shop · 今日推荐</header>
<main>
  <div class="card"><div>味噌ラーメン</div><div class="price">¥980</div><button class="buy">加入购物车</button></div>
  <div class="card"><div>唐揚げ弁当</div><div class="price">¥850</div><button class="buy">加入购物车</button></div>
  <div class="card"><div>餃子セット</div><div class="price">¥620</div><button class="buy">加入购物车</button></div>
</main>
</body>
</html>
